<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img">
  <title>Ilustração de um bairro com chuva forte, rio cheio e um celular recebendo alerta</title>
  <rect width="600" height="440" fill="#dcebf7"/>
  <!-- nuvens -->
  <g fill="#6f8ea8" stroke="#06223a" stroke-width="3">
    <ellipse cx="150" cy="70" rx="86" ry="34"/>
    <ellipse cx="230" cy="56" rx="62" ry="30"/>
    <ellipse cx="330" cy="82" rx="70" ry="28"/>
  </g>
  <!-- chuva -->
  <g stroke="#0b4f8a" stroke-width="5" stroke-linecap="round">
    <line x1="90" y1="120" x2="78" y2="152"/><line x1="140" y1="124" x2="128" y2="156"/>
    <line x1="190" y1="118" x2="178" y2="150"/><line x1="240" y1="124" x2="228" y2="156"/>
    <line x1="290" y1="120" x2="278" y2="152"/><line x1="340" y1="128" x2="328" y2="160"/>
    <line x1="115" y1="170" x2="103" y2="202"/><line x1="215" y1="172" x2="203" y2="204"/>
    <line x1="315" y1="176" x2="303" y2="208"/>
  </g>
  <!-- morro -->
  <path d="M0 330 Q110 230 250 316 L250 360 L0 360 Z" fill="#3f8a5f" stroke="#06223a" stroke-width="3"/>
  <!-- casas -->
  <g stroke="#06223a" stroke-width="3" stroke-linejoin="round">
    <rect x="28" y="276" width="66" height="56" fill="#ffffff"/>
    <polygon points="20,276 61,244 102,276" fill="#06223a"/>
    <rect x="48" y="300" width="18" height="32" fill="#ffc400"/>
    <rect x="112" y="288" width="60" height="52" fill="#ffffff"/>
    <polygon points="104,288 142,258 180,288" fill="#a5001f"/>
    <rect x="128" y="308" width="16" height="32" fill="#06223a"/>
    <rect x="188" y="298" width="54" height="46" fill="#ffffff"/>
    <polygon points="181,298 215,270 249,298" fill="#06223a"/>
  </g>
  <!-- rio -->
  <path d="M0 346 Q150 322 300 350 T600 338 L600 440 L0 440 Z" fill="#1f6fb2" stroke="#06223a" stroke-width="3"/>
  <path d="M0 384 Q150 366 300 388 T600 378" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M0 414 Q150 398 300 418 T600 408" fill="none" stroke="#dcebf7" stroke-width="5" stroke-linecap="round"/>
  <!-- ponte -->
  <rect x="268" y="326" width="150" height="14" fill="#06223a"/>
  <rect x="288" y="340" width="10" height="36" fill="#06223a"/><rect x="388" y="340" width="10" height="36" fill="#06223a"/>
  <!-- celular -->
  <g transform="translate(396 96)">
    <rect width="168" height="300" rx="22" fill="#04121f"/>
    <rect x="10" y="18" width="148" height="264" rx="12" fill="#ffffff"/>
    <rect x="20" y="32" width="128" height="58" rx="6" fill="#a5001f"/>
    <text x="84" y="57" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">ALERTA</text>
    <text x="84" y="79" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">CRÍTICO</text>
    <rect x="20" y="106" width="128" height="10" rx="5" fill="#27394a"/>
    <rect x="20" y="126" width="100" height="10" rx="5" fill="#27394a"/>
    <rect x="20" y="146" width="116" height="10" rx="5" fill="#27394a"/>
    <rect x="20" y="166" width="84" height="10" rx="5" fill="#27394a"/>
    <rect x="20" y="206" width="128" height="52" rx="6" fill="#ffc400" stroke="#04121f" stroke-width="3"/>
    <text x="84" y="238" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#04121f" text-anchor="middle">Ponto de apoio</text>
  </g>
</svg>
